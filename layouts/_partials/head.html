{{- /* The devlog's own additions to the head: the feed link, and the
style rules only a log of posts needs. The shell itself comes from
the theme. */ -}}
{{ with .OutputFormats.Get "atom" }}<link rel="alternate" type="application/atom+xml" title="{{ site.Title }}" href="{{ .RelPermalink }}">{{ end }}
<style>
  /* An image in a post never exceeds the text column. */
  main img { max-width: 100%; height: auto; }
  /* A post's date line sits tight under its heading, in the muted
     ink, with the backfill note beside the date. */
  article header h1, article header h2 { margin-bottom: 0.25rem; }
  article header h2 a { text-decoration: none; }
  article header h2 a:hover { text-decoration: underline; }
  p.dates { margin-top: 0; color: var(--ink-muted); font-size: 0.9em; }
  .backfilled { font-size: 0.9em; }
  /* On the front page, a rule separates the posts, and each post
     gets air above it, so the stream reads as entries rather than
     one document. */
  main > article.post { margin-top: 3rem; padding-top: 2rem;
                        border-top: 1px solid var(--rule); }
  main > article.post:first-of-type { margin-top: 0; padding-top: 0;
                                      border-top: none; }
  /* The chronological neighbors: older on the left, newer on the
     right, each named by its title. */
  nav.post-nav { display: flex; justify-content: space-between;
                 gap: 2rem; margin-top: 3rem; padding-top: 1rem;
                 border-top: 1px solid var(--rule); font-size: 0.9em; }
  nav.post-nav .newer { text-align: right; margin-left: auto; }
  nav.post-nav a { text-decoration: none; }
  nav.post-nav a:hover { text-decoration: underline; }
  nav.post-nav time { color: var(--ink-muted); font-size: 0.9em; }
  /* The sidebar's recent posts open with a compact month-day date
     in the muted ink; the archive line below the list carries the
     years. Each entry stays on one line: a long title ellipsizes,
     and the anchor's title attribute holds the whole name for the
     hover. The list sits flush with its heading, because everything
     in this sidebar is the log; the manuals' indent marks a tree
     this list is not. */
  aside ul { padding-left: 0; }
  aside li { margin-bottom: 0.4rem; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  aside li a { text-decoration: none; }
  aside li a:hover { text-decoration: underline; }
  aside li time { color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  footer { margin-top: 3rem; padding-top: 1rem;
           border-top: 1px solid var(--rule); font-size: 0.9em; }
  footer a { margin-right: 1.5rem; }
</style>
