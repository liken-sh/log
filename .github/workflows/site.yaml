# This is the website deploy. The repository is the site: the posts,
# the layouts, and the configuration are all of it, so every push to
# main is a publish. The job builds the tree and deploys it to GitHub
# Pages, which serves it at log.liken.sh. On a pull request, the job
# stops after the build: it proves the site still builds, and
# publishes nothing.
#
# Publishing needs two permissions. pages: write creates the
# deployment, and id-token: write lets deploy-pages prove to the
# Pages service that the artifact came from this exact workflow run.
# Nothing else can push content under this site's name.
name: site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A dispatch republishes the current main with no change, for the
  # times the serving side needs a fresh deployment.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys run one at a time: two pushes in quick succession would
# otherwise race their deployments, and the served-site check below
# needs nothing else to change while it runs.
concurrency:
  group: site

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The theme is the brand repository, a submodule at
      # themes/brand. A checkout without it builds a site with no
      # shell, no nav, and no stylesheet.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The site is a Go module, and Hugo is a tool directive in it,
      # so the Go toolchain is the only build dependency and this
      # file pins its version too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # setup-go saves its cache only when its key misses, and the key
      # tracks go.sum, so between two bumps of that file the Go build
      # cache inside the entry never refreshes, and Go trims the
      # compiled Hugo objects out of it. This entry saves on every run,
      # under a key that ends in the commit, and restores the newest
      # entry for the same go.sum, so Hugo compiles once per bump.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: site-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: site-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-

      # The same command a workstation runs, so local and CI builds
      # produce the same tree. What this step writes to dist/site/
      # is byte for byte what Pages serves.
      - name: build the site
        run: make build

      # The commit lands in the built tree as release.txt, so the
      # served-site check below can ask the public name which commit
      # it serves. The file joins the tree after the build, because
      # it describes the deploy, not the site.
      - name: stamp the commit
        run: echo "${{ github.sha }}" > dist/site/release.txt

      # Everything below publishes, so pull requests stop here.
      - name: package the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - name: deploy to Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v5

      # This step proves the deploy the way a reader meets it: the
      # site served over the public name is the one this commit
      # built. release.txt holds the commit, and the other checks
      # cover the two forms every page takes.
      - name: verify the served site
        if: github.event_name != 'pull_request'
        run: |
          # A finished deployment does not mean the public name
          # follows yet. A CDN in front of Pages caches pages for up
          # to ten minutes, so the old tree can answer for a while
          # after the new one is live at the origin. curl's --retry
          # only covers transport errors, never stale content, so
          # the freshness check needs its own deadline loop before
          # the content checks below can mean anything.
          expected="${{ github.sha }}"
          for _ in $(seq 1 48); do
            served="$(curl --fail --silent https://log.liken.sh/release.txt || true)"
            if [ "$served" = "$expected" ]; then break; fi
            sleep 15
          done
          [ "$served" = "$expected" ] || {
            echo "the site still serves ${served:-nothing}, expected $expected"
            exit 1
          }
          # The content checks name themselves before they run, so a
          # failure's last log line says which page broke. Each curl
          # retries transport errors; a wrong-content grep still
          # fails at once, because wrong content is not transient.
          fetch() {
            curl --fail --silent --retry 5 --retry-delay 3 \
              --retry-all-errors "$@"
          }
          echo "checking the front page renders the posts"
          fetch https://log.liken.sh/ | grep -q 'article class="post"'
          # Pages serves the feed as plain application/xml, so the
          # check reads the document itself for the Atom root.
          echo "checking the feed"
          fetch https://log.liken.sh/atom.xml | grep -q "<feed"
          echo "checking the markdown twin"
          fetch --head https://log.liken.sh/index.md \
            | grep -qi "content-type: text/markdown"
